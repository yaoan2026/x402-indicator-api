# Render Blueprint：在 Render 選 New > Blueprint，連到這個 repo 就會照這裡的設定部署
services:
  - type: web
    name: x402-indicator-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: 'uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # 你的收款地址（MetaMask 地址），部署時 Render 會請你填
      - key: PAY_TO
        sync: false
      - key: PRICE
        value: "$0.01"
      # eip155:8453 = Base 主網（收真的 USDC）；改回 eip155:84532 就是 Base Sepolia 測試網
      - key: NETWORK
        value: eip155:8453
      - key: FACILITATOR_URL
        value: https://x402.org/facilitator
      # Coinbase CDP facilitator（需要下面兩個金鑰）；x402.org 那個只支援測試網
      - key: USE_CDP_FACILITATOR
        value: "true"
      # Coinbase Developer Platform 的 API 金鑰：只在 Render 的 Environment 頁面填，不要寫進程式
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: ENABLE_BAZAAR
        value: "true"
      - key: PAYMENTS_ENABLED
        value: "true"
